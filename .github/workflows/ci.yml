name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Type-check every package on four targets; the Windows host checks its
  # own in the test job.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-10
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: odin check
        run: |
          set -e
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            for p in core core/disc core/learnfile psx ps2 ps2/host tests/discimg; do
              echo "== $t $p"
              odin check $p -no-entry-point -collection:ps=. -target:$t -vet -strict-style
            done
            echo "== $t recomp"
            odin check recomp -collection:ps=. -target:$t -vet -strict-style
            echo "== $t play"
            odin check play -collection:ps=. -target:$t -vet -strict-style
            for p in tests/core tests/native tests/psx_cover tests/ee_native tests/ee_spin tests/fpu tests/lower tests/discover tests/vu tests/gs tests/gs_tex tests/gs_pixel tests/gs_hw tests/vu_macro tests/vu_micro tests/vu_native tests/ee_emit tests/spu tests/psx_fallback tests/psx_codewatch tests/psx_learned tests/iop_learned tests/ee_learned tests/psx_unaligned tests/psx_gte tests/psx_timer tests/ps2_kernel tests/ps2_iop tests/iop_thread_grow tests/ps2_interp tests/ee_syscall_handler tests/psx_bios tests/psx_bios_libc tests/disc tests/host_frames tests/data tests/mod tests/psx_mod tests/psx_interp tests/compat tests/learn tests/play; do
              echo "== $t $p"
              odin check $p -collection:ps=. -target:$t -vet -strict-style
            done
          done
          echo "== wasi_wasm32 recomp"
          odin check recomp -collection:ps=. -target:wasi_wasm32 -vet -strict-style

  # Run every test on each host. macOS has no test job (GitHub's hosted
  # macOS runners stalled on capacity); darwin is type-checked above only.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-10
          token: ${{ secrets.GITHUB_TOKEN }}
      # SDL2 for the tests that call it (tests/host_frames, tests/data,
      # tests/psx_interp, tests/compat, tests/play); Windows uses Odin's
      # vendor SDL2.dll, put next to the tests.
      - name: install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: check windows packages
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          for p in core core/disc core/learnfile psx ps2 ps2/host tests/discimg; do odin check $p -no-entry-point -collection:ps=. -vet -strict-style; done
          odin check recomp -collection:ps=. -vet -strict-style
          odin check play -collection:ps=. -vet -strict-style
      - name: test
        shell: bash
        run: |
          set -e
          odin run tests/core -collection:ps=. -out:core_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/native -collection:ps=. -out:native_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ee_native -collection:ps=. -out:ee_native_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ee_spin -collection:ps=. -out:ee_spin_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/fpu -collection:ps=. -out:fpu_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/lower -collection:ps=. -out:lower_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/discover -collection:ps=. -out:discover_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/vu -collection:ps=. -out:vu_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/gs -collection:ps=. -out:gs_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/gs_tex -collection:ps=. -out:gs_tex_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/gs_pixel -collection:ps=. -out:gs_pixel_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/gs_hw -collection:ps=. -out:gs_hw_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/vu_macro -collection:ps=. -out:vu_macro_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/vu_micro -collection:ps=. -out:vu_micro_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/vu_native -collection:ps=. -out:vu_native_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ee_emit -collection:ps=. -out:ee_emit_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/spu -collection:ps=. -out:spu_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_fallback -collection:ps=. -out:psx_fallback_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_fallback -collection:ps=. -define:FALLBACK_COUNT=true -out:psx_fallback_count_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_codewatch -collection:ps=. -out:psx_codewatch_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_codewatch -collection:ps=. -define:FALLBACK_COUNT=true -out:psx_codewatch_count_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_learned -collection:ps=. -out:psx_learned_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/iop_learned -collection:ps=. -out:iop_learned_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ee_learned -collection:ps=. -out:ee_learned_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_unaligned -collection:ps=. -out:psx_unaligned_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_gte -collection:ps=. -out:psx_gte_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_cover -collection:ps=. -out:psx_cover_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_timer -collection:ps=. -out:psx_timer_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ps2_kernel -collection:ps=. -out:ps2_kernel_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ps2_iop -collection:ps=. -out:ps2_iop_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/iop_thread_grow -collection:ps=. -out:iop_thread_grow_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/iop_thread_grow -collection:ps=. -define:PS_FLAT=true -out:iop_thread_grow_flat_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ps2_interp -collection:ps=. -out:ps2_interp_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ps2_interp -collection:ps=. -define:FALLBACK_COUNT=true -out:ps2_interp_count_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ee_syscall_handler -collection:ps=. -out:ee_syscall_handler_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/ee_syscall_handler -collection:ps=. -define:PS_FLAT=true -out:ee_syscall_handler_flat_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_bios -collection:ps=. -out:psx_bios_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_bios_libc -collection:ps=. -out:psx_bios_libc_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/disc -collection:ps=. -out:disc_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/learn -collection:ps=. -out:learn_test${{ runner.os == 'Windows' && '.exe' || '' }}
          if [ "$RUNNER_OS" = Windows ]; then cp "$(odin root)/vendor/sdl2/SDL2.dll" .; fi
          odin run tests/host_frames -collection:ps=. -out:host_frames_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/data -collection:ps=. -out:data_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/mod -collection:ps=. -out:mod_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_mod -collection:ps=. -out:psx_mod_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_mod -collection:ps=. -define:PS_FLAT=true -out:psx_mod_flat_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/psx_interp -collection:ps=. -out:psx_interp_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/compat -collection:ps=. -out:compat_test${{ runner.os == 'Windows' && '.exe' || '' }}
          odin run tests/play -collection:ps=. -define:COMMIT=test -out:play_test${{ runner.os == 'Windows' && '.exe' || '' }}
